<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      background: #7b0627;
      color: white;
      padding: 20px;
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    form div {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background: #e10b0b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e68900;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    caption {
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      background: #920b3c;
      color: white;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #88093a;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    tr:hover {
      background: #ffe0b2;
    }

    tfoot td {
      font-weight: bold;
      background: #fafafa;
    }

    #total-cell {
      color: green;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Expense Tracker</h1>

  <div class="container">
    <form id="expense-form">
      <div>
        <label for="name">Expense Name</label>
        <input id="name" name="name" type="text" placeholder="e.g. Groceries" required />
      </div>
      <div>
        <label for="amount">Amount (₹)</label>
        <input id="amount" name="amount" type="number" step="0.01" placeholder="e.g. 100" required />
      </div>
      <div>
        <label for="desc">Description</label>
        <input id="desc" name="desc" type="text" placeholder="e.g. Bought fruits and vegetables" />
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" name="date" type="date" />
      </div>
      <div>
        <button id="add-btn" type="submit">Add Expense</button>
      </div>
    </form>

    <table id="expenses-table">
      <caption>Expenses</caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Amount (₹)</th>
          <th>Description</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expenses-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="3" align="right"><strong>Total:</strong></td>
          <td id="total-cell" align="left">₹0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    (function () {
      const form = document.getElementById('expense-form');
      const body = document.getElementById('expenses-body');
      const totalCell = document.getElementById('total-cell');
      const expenses = [];

      function formatCurrency(num) {
        const rounded = Math.round((Number(num) || 0) * 100) / 100;
        return '₹' + rounded.toFixed(2);
      }

      function updateTotal() {
        let total = 0;
        for (const e of expenses) total += Number(e.amount) || 0;
        totalCell.textContent = formatCurrency(total);
      }

      function renderExpenses() {
        while (body.firstChild) body.removeChild(body.firstChild);
        expenses.forEach((exp, index) => {
          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          tdName.textContent = exp.name || '';
          tr.appendChild(tdName);

          const tdAmount = document.createElement('td');
          tdAmount.textContent = formatCurrency(exp.amount);
          tr.appendChild(tdAmount);

          const tdDesc = document.createElement('td');
          tdDesc.textContent = exp.description || '';
          tr.appendChild(tdDesc);

          const tdDate = document.createElement('td');
          tdDate.textContent = exp.date || '';
          tr.appendChild(tdDate);

          const tdAction = document.createElement('td');
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = 'Delete';
          delBtn.style.background = "red";
          delBtn.style.padding = "6px 12px";
          delBtn.style.borderRadius = "6px";
          delBtn.style.cursor = "pointer";
          delBtn.style.color = "white";
          delBtn.addEventListener('click', function () {
            expenses.splice(index, 1);
            renderExpenses();
            updateTotal();
          });
          tdAction.appendChild(delBtn);
          tr.appendChild(tdAction);

          body.appendChild(tr);
        });

        if (expenses.length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 5;
          td.textContent = 'No expenses added yet.';
          td.style.textAlign = "center";
          td.style.color = "#777";
          tr.appendChild(td);
          body.appendChild(tr);
        }
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        const name = document.getElementById('name').value.trim();
        const amountRaw = document.getElementById('amount').value;
        const description = document.getElementById('desc').value.trim();
        const date = document.getElementById('date').value;
        const amount = Number(amountRaw);
        if (!name) {
          alert('Please enter an expense name.');
          return;
        }
        if (isNaN(amount) || amount <= 0) {
          alert('Please enter a valid amount greater than 0.');
          return;
        }
        expenses.push({ name: name, amount: amount, description: description, date: date });
        form.reset();
        renderExpenses();
        updateTotal();
      });

      renderExpenses();
      updateTotal();
    })();
  </script>
</body>
</html>
