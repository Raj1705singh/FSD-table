<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Marks System</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>

  <h2>Student Marks System</h2>
  <p>A simple interactive demo to practice JavaScript arrays (add, remove, sort, avg, find max).</p>
  <p>Total students: <span id="total">0</span></p>

  <table id="studentsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="controls">
    <button onclick="showHighest()" class="buttonCOlor">Show Highest</button>
    <button onclick="showAverage()" >Show Average</button>
    <button onclick="sortByMarks()" >Sort by Marks ↓</button>
    <button onclick="resetSample()" >Reset Sample</button>
    <button onclick="removeLast()" >Remove Last</button>
  </div>

  <div class="add-student">
    <input type="text" id="studentName" placeholder="Student name">
    <input type="text" id="studentSubject" placeholder="Subject">
    <input type="number" id="studentMarks" placeholder="Marks (0-100)">
    <button onclick="addStudent()">Add Student</button>
  </div>

  <p id="message"></p>

  <script src="2.js"></script>
</body>
</html>
